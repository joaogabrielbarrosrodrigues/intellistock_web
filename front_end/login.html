<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | IntelliStock</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/styles.css" rel="stylesheet"><script src="/js/api.js" defer></script><script src="/js/login.js" defer></script></head><body><main class="container py-5" style="max-width:480px"><section class="content-card p-4"><img src="/img/intellistock-symbol.png" width="64" alt="IntelliStock"><h1 class="h3 mt-3">Entrar no IntelliStock</h1><p>Acesse sua conta para gerenciar o estoque.</p><div id="erro" class="alert alert-danger d-none" role="alert"></div><form id="login"><label class="form-label" for="email">E-mail</label><input class="form-control mb-3" type="email" id="email" required autocomplete="username"><label class="form-label" for="senha">Senha</label><input class="form-control mb-3" type="password" id="senha" required autocomplete="current-password"><button class="btn btn-primary w-100">Entrar</button></form></section></main></body></html>
