<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse sua conta no IntelliStock Web.">
  <title>Entrar | IntelliStock Web</title>
  <link rel="icon" type="image/png" href="/img/intellistock-symbol.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body class="auth-page auth-page-login">
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="authHeading">
      <div class="auth-panel-inner">
        <a class="auth-brand" href="/" aria-label="IntelliStock Web, página inicial">
          <img src="/img/intellistock-symbol.png" width="42" height="42" alt="">
          <span>Intelli<span>Stock</span></span>
        </a>

        <div class="auth-intro">
          <h1 id="authHeading">Bem-vindo de volta</h1>
          <p>Entre para acessar seu estoque.</p>
        </div>

        <div id="erro" class="alert alert-danger d-none" role="alert"></div>
        <form id="login" class="auth-form">
          <label for="email">E-mail</label>
          <input id="email" class="auth-field" type="email" required autocomplete="username" placeholder="seu@email.com">

          <label for="senha">Senha</label>
          <input id="senha" class="auth-field" type="password" required autocomplete="current-password" placeholder="Sua senha">

          <button class="auth-submit" type="submit">Entrar</button>
        </form>
        <a class="auth-secondary-action" href="/cadastro.html">Cadastrar-se</a>
      </div>
    </section>
  </main>
</body>
</html>
