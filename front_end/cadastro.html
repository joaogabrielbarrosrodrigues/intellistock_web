<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crie uma conta no IntelliStock Web.">
  <title>Cadastrar-se | IntelliStock Web</title>
  <link rel="icon" type="image/png" href="/img/intellistock-symbol.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/api.js" defer></script>
  <script src="/js/cadastro.js" defer></script>
</head>
<body class="auth-page auth-page-cadastro">
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="authHeading">
      <div class="auth-panel-inner">
        <a class="auth-brand" href="/" aria-label="IntelliStock Web, página inicial">
          <img src="/img/intellistock-symbol.png" width="42" height="42" alt="">
          <span>Intelli<span>Stock</span></span>
        </a>

        <div class="auth-intro">
          <h1 id="authHeading">Crie sua conta</h1>
          <p>Preencha seus dados para começar.</p>
        </div>

        <div id="erro" class="alert alert-danger d-none" role="alert"></div>
        <form id="cadastro" class="auth-form">
          <label for="nomeCadastro">Nome</label>
          <input id="nomeCadastro" class="auth-field" required maxlength="120" autocomplete="name" placeholder="Seu nome">

          <label for="emailCadastro">E-mail</label>
          <input id="emailCadastro" class="auth-field" type="email" required maxlength="180" autocomplete="email" placeholder="seu@email.com">

          <label for="senhaCadastro">Senha</label>
          <input id="senhaCadastro" class="auth-field" type="password" required minlength="6" autocomplete="new-password" placeholder="Pelo menos 6 caracteres">

          <label for="confirmarSenha">Confirmar senha</label>
          <input id="confirmarSenha" class="auth-field" type="password" required minlength="6" autocomplete="new-password" placeholder="Repita sua senha">

          <button class="auth-submit" type="submit">Cadastrar-se</button>
        </form>
        <a class="auth-secondary-action" href="/login.html">Voltar para entrar</a>
      </div>
    </section>
  </main>
</body>
</html>
